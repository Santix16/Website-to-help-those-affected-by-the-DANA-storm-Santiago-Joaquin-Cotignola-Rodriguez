services:
  mysql:
    image: mysql:8.4
    container_name: tutela-dana-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tele_dana
      MYSQL_USER: tele_dana
      MYSQL_PASSWORD: tele_dana_local
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tele_dana", "-ptele_dana_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
